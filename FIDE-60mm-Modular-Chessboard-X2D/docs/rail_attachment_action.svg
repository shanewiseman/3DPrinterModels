<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc3b3b"/></marker>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.board{fill:#e8dcc0;stroke:#5f5145;stroke-width:3}
      .rail{fill:#20262e;stroke:#0f172a;stroke-width:3}.steel{fill:#7b8794;stroke:#334155;stroke-width:3}
      .nut{fill:#8b97a4;stroke:#334155;stroke-width:3}.move{fill:none;stroke:#dc3b3b;stroke-width:7;marker-end:url(#arrow)}
      .dim{fill:none;stroke:#2563eb;stroke-width:4}.title{font:700 28px Arial;fill:#172033}.head{font:700 24px Arial;fill:#172033}
      .label{font:700 19px Arial;fill:#233044}.text{font:17px Arial;fill:#526174}.badge{fill:#2563eb}
      .badgeText{font:700 20px Arial;fill:#fff;text-anchor:middle}.ok{fill:#eaf8ef;stroke:#41a467;stroke-width:3}
    </style>
  </defs>
  <rect width="1500" height="560" rx="20" fill="#eef3f8"/>
  <text x="35" y="44" class="title">Perimeter rail — slide the tongue into the board, then fasten from below</text>

  <rect x="30" y="70" width="700" height="455" rx="16" class="panel"/>
  <circle cx="67" cy="108" r="22" class="badge"/><text x="67" y="115" class="badgeText">1</text>
  <text x="102" y="116" class="head">Engage the full-length rail tongue</text>
  <path d="M85 195 H335 V320 H85 Z" class="rail"/>
  <path d="M335 242 H410 L438 257 L410 272 H335 Z" class="rail"/>
  <path d="M470 238 H685 V370 H470 V286 L445 270 L470 254 Z" class="board"/>
  <polygon points="555,306 575,294 595,306 595,330 575,342 555,330" class="nut"/>
  <path d="M410 257 H448" class="move"/>
  <text x="85" y="164" class="label">Black raised rail</text>
  <text x="245" y="228" class="label">Rail tongue</text>
  <text x="485" y="222" class="label">Outer board groove</text>
  <text x="491" y="395" class="label">Captured M3 nut</text>
  <text x="85" y="435" class="text">Slide the rail straight along the entire edge.</text>
  <text x="85" y="463" class="text">Do not use the screws to pull a blocked tongue into place.</text>
  <text x="85" y="493" class="text">The 0.5 mm lead-in should start the connection easily.</text>

  <rect x="765" y="70" width="705" height="455" rx="16" class="panel"/>
  <circle cx="802" cy="108" r="22" class="badge"/><text x="802" y="115" class="badgeText">2</text>
  <text x="837" y="116" class="head">Fasten the seated rail from below</text>
  <path d="M810 190 H1025 V375 H810 Z" class="rail"/>
  <path d="M1025 270 H1110 L1138 285 L1110 300 H1025 Z" class="rail"/>
  <path d="M1138 190 H1425 V375 H1138 V300 L1110 285 L1138 270 Z" class="board"/>
  <polygon points="1252,272 1272,260 1292,272 1292,296 1272,308 1252,296" class="nut"/>
  <rect x="1263" y="294" width="18" height="142" rx="8" class="steel"/>
  <circle cx="1272" cy="426" r="19" class="steel"/>
  <path d="M1272 492 V443" class="move"/>
  <path d="M1070 158 V188 M1050 158 H1090 M1050 188 H1090" class="dim"/>
  <text x="1005" y="148" class="label">10 mm rise</text>
  <rect x="815" y="397" width="330" height="78" rx="12" class="ok"/>
  <text x="836" y="428" class="label">Correct locked state</text>
  <text x="836" y="454" class="text">Tongue fully seated; border continuous.</text>
  <text x="1177" y="346" class="label">M3×12 screw</text>
  <text x="1177" y="370" class="text">through recessed rail flange</text>
  <text x="1177" y="493" class="text">Start both rail screws before tightening.</text>
</svg>
