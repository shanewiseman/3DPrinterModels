<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <pattern id="checker" width="102" height="102" patternUnits="userSpaceOnUse">
      <rect width="102" height="102" fill="#e8dcc1"/>
      <rect width="51" height="51" fill="#6e5542"/>
      <rect x="51" y="51" width="51" height="51" fill="#6e5542"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 36px 'DejaVu Sans', sans-serif; fill: #111827; }
      .subtitle { font: 400 20px 'DejaVu Sans', sans-serif; fill: #475569; }
      .panelTitle { font: 700 23px 'DejaVu Sans', sans-serif; fill: #111827; }
      .label { font: 600 17px 'DejaVu Sans', sans-serif; fill: #1f2937; }
      .small { font: 400 15px 'DejaVu Sans', sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'DejaVu Sans', sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .boardBody { fill: #e8dcc1; stroke: #5f5145; stroke-width: 3; }
      .void { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .hardware { fill: #64748b; stroke: #334155; stroke-width: 2; }
      .dim { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .callout { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f1f5f9"/>
  <text x="46" y="54" class="title">Recommended connection refinements — examples and locations</text>
  <text x="46" y="84" class="subtitle">Features 2, 3, and 4 are implemented in the production STEP/STL files.</text>

  <!-- Board-wide location map -->
  <rect x="30" y="108" width="1540" height="510" class="panel"/>
  <text x="55" y="143" class="panelTitle">Board-wide location map</text>
  <rect x="70" y="165" width="430" height="430" rx="3" fill="#171717" stroke="#0f172a" stroke-width="3"/>
  <rect x="87" y="182" width="396" height="396" fill="url(#checker)" stroke="#111827" stroke-width="2"/>
  <line x1="285" y1="182" x2="285" y2="578" stroke="#0f172a" stroke-width="4"/>
  <line x1="87" y1="380" x2="483" y2="380" stroke="#0f172a" stroke-width="4"/>

  <!-- #1 nut-retainer example locations -->
  <g fill="#f59e0b" stroke="#7c2d12" stroke-width="2">
    <circle cx="180" cy="174" r="8"/><circle cx="390" cy="174" r="8"/>
    <circle cx="180" cy="586" r="8"/><circle cx="390" cy="586" r="8"/>
    <circle cx="78" cy="278" r="8"/><circle cx="78" cy="482" r="8"/>
    <circle cx="492" cy="278" r="8"/><circle cx="492" cy="482" r="8"/>
    <circle cx="285" cy="278" r="8"/><circle cx="285" cy="482" r="8"/>
    <circle cx="180" cy="380" r="8"/><circle cx="390" cy="380" r="8"/>
  </g>

  <!-- #2 chamfer paths -->
  <rect x="80" y="175" width="410" height="410" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="11 8"/>
  <line x1="285" y1="185" x2="285" y2="575" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="90" y1="380" x2="480" y2="380" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- #3 upper seam keys -->
  <g fill="#22c55e" stroke="#166534" stroke-width="2">
    <rect x="274" y="240" width="22" height="36" rx="5"/>
    <rect x="274" y="482" width="22" height="36" rx="5"/>
    <rect x="140" y="369" width="36" height="22" rx="5"/>
    <rect x="394" y="369" width="36" height="22" rx="5"/>
  </g>

  <!-- #4 corner locks -->
  <g fill="#ef4444" stroke="#7f1d1d" stroke-width="2">
    <circle cx="82" cy="177" r="12"/><circle cx="488" cy="177" r="12"/>
    <circle cx="82" cy="583" r="12"/><circle cx="488" cy="583" r="12"/>
  </g>

  <g transform="translate(555,175)">
    <circle cx="14" cy="18" r="13" fill="#f59e0b" stroke="#7c2d12" stroke-width="2"/>
    <text x="8" y="24" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="42" y="16" class="label">Nut-retaining plugs</text>
    <text x="42" y="39" class="small">At every side-loaded M3 nut entrance.</text>
    <text x="42" y="60" class="small">Most important on the four hidden center interfaces.</text>

    <circle cx="14" cy="105" r="13" fill="#2563eb"/>
    <text x="8" y="111" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="42" y="103" class="label">Lead-in chamfers and first-layer relief</text>
    <text x="42" y="126" class="small">All quarter tongues/grooves, perimeter tongues,</text>
    <text x="42" y="147" class="small">corner ribs/cap slots, and nut-slot entrances.</text>

    <circle cx="14" cy="192" r="13" fill="#22c55e" stroke="#166534" stroke-width="2"/>
    <text x="8" y="198" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="42" y="190" class="label">Upper anti-lip seam keys</text>
    <text x="42" y="213" class="small">Two short keys on each 240 mm quarter-to-quarter</text>
    <text x="42" y="234" class="small">interface, near the upper part of the structural body.</text>

    <circle cx="14" cy="279" r="13" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <text x="8" y="285" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="42" y="277" class="label">M2 corner-cap locks</text>
    <text x="42" y="300" class="small">One hidden M2×12 cross-screw at each corner.</text>

    <rect x="0" y="342" width="950" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="370" class="label">Color key</text>
    <circle cx="30" cy="395" r="7" fill="#f59e0b"/><text x="44" y="400" class="small">nut retention</text>
    <circle cx="205" cy="395" r="7" fill="#2563eb"/><text x="219" y="400" class="small">print-fit treatment</text>
    <circle cx="420" cy="395" r="7" fill="#22c55e"/><text x="434" y="400" class="small">surface registration</text>
    <circle cx="660" cy="395" r="7" fill="#ef4444"/><text x="674" y="400" class="small">cap retention</text>
  </g>

  <!-- Detail 1 -->
  <rect x="30" y="640" width="755" height="255" class="panel"/>
  <text x="52" y="676" class="panelTitle">1  Captured-nut retaining plug</text>
  <text x="52" y="700" class="small">Section through one board edge and screw location</text>
  <rect x="92" y="728" width="500" height="92" class="boardBody"/>
  <rect x="92" y="762" width="206" height="27" class="void"/>
  <polygon points="278,756 296,746 314,756 314,777 296,787 278,777" class="hardware"/>
  <rect x="98" y="758" width="27" height="35" rx="3" fill="#f59e0b" stroke="#7c2d12" stroke-width="2"/>
  <path d="M104 758 L119 758 L125 764 L125 787 L119 793 L104 793 Z" fill="#f59e0b"/>
  <rect x="252" y="820" width="88" height="29" rx="3" fill="#1f2937"/>
  <line x1="296" y1="860" x2="296" y2="773" stroke="#64748b" stroke-width="8"/>
  <circle cx="296" cy="854" r="13" class="hardware"/>
  <path d="M185 741 L120 763" class="callout"/>
  <text x="146" y="728" class="label">Keyed printed plug</text>
  <text x="146" y="747" class="tiny">Inserted after the M3 nut</text>
  <path d="M444 746 L316 758" class="callout"/>
  <text x="424" y="728" class="label">Captured M3 nut</text>
  <text x="424" y="747" class="tiny">Cannot rotate in hex pocket</text>
  <text x="350" y="838" class="small">M3×12 screw from underside</text>
  <text x="350" y="857" class="small">bracket or perimeter flange</text>
  <text x="52" y="876" class="tiny">Applied to all nut-loading slots. The plug prevents a nut escaping</text>
  <text x="52" y="891" class="tiny">before its mating quarter or perimeter rail covers the edge.</text>

  <!-- Detail 2 -->
  <rect x="815" y="640" width="755" height="255" class="panel"/>
  <text x="837" y="676" class="panelTitle">2  Lead-ins and elephant-foot relief</text>
  <text x="837" y="700" class="small">Example quarter tongue entering its matching groove</text>
  <path d="M865 735 H1090 V769 L1110 780 L1090 791 V831 H865 Z" class="boardBody"/>
  <path d="M1140 735 H1515 V831 H1140 V795 L1162 784 L1140 773 Z" class="boardBody"/>
  <path d="M1090 769 L1110 780 L1090 791" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M1140 773 L1162 784 L1140 795" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M865 831 L875 821 H900" fill="none" stroke="#2563eb" stroke-width="6"/>
  <path d="M1515 831 L1505 821 H1480" fill="none" stroke="#2563eb" stroke-width="6"/>
  <line x1="1118" y1="784" x2="1133" y2="784" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1040 718 L1098 770" class="callout"/>
  <text x="886" y="716" class="label">0.5 mm × 45° lead-in</text>
  <path d="M1400 850 L1504 825" class="callout"/>
  <text x="1160" y="858" class="small">0.4 mm first-layer relief</text>
  <text x="837" y="872" class="tiny">Also applied to perimeter tongues, groove mouths, corner ribs/cap slots,</text>
  <text x="837" y="888" class="tiny">and nut-channel entrances.</text>

  <!-- Detail 3 -->
  <rect x="30" y="915" width="755" height="270" class="panel"/>
  <text x="52" y="951" class="panelTitle">3  Upper anti-lip seam key</text>
  <text x="52" y="975" class="small">Section through two assembled playing quarters</text>
  <path d="M80 1004 H404 V1105 H80 Z" class="boardBody"/>
  <path d="M406 1004 H735 V1105 H406 Z" class="boardBody"/>
  <rect x="80" y="1004" width="655" height="18" fill="#d8c59f" stroke="#5f5145" stroke-width="2"/>
  <path d="M350 1075 H428 V1094 H350 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <path d="M366 1038 H438 V1057 H366 L354 1047 Z" fill="#22c55e" stroke="#166534" stroke-width="2"/>
  <rect x="505" y="1010" width="255" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M520 1064 L437 1048" class="callout"/>
  <text x="520" y="1029" class="label">Implemented upper key</text>
  <text x="520" y="1048" class="tiny">Z5–7 mm; 0.25 mm depth clearance</text>
  <path d="M215 1128 L353 1090" class="callout"/>
  <text x="82" y="1144" class="label">Existing lower tongue</text>
  <text x="350" y="1135" class="tiny">Two short upper keys per 240 mm interface</text>
  <text x="350" y="1152" class="tiny">keep the playing faces flush without showing above.</text>

  <!-- Detail 4 -->
  <rect x="815" y="915" width="755" height="270" class="panel"/>
  <text x="837" y="951" class="panelTitle">4  Positive corner-cap retention</text>
  <text x="837" y="975" class="small">Cutaway through one corner cap and one rail rib</text>
  <rect x="900" y="1002" width="465" height="120" rx="8" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
  <rect x="1012" y="1018" width="225" height="88" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <rect x="1230" y="1036" width="34" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <line x1="875" y1="1062" x2="1250" y2="1062" stroke="#ef4444" stroke-width="10"/>
  <circle cx="887" cy="1062" r="17" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
  <polygon points="1245,1047 1261,1054 1261,1070 1245,1077 1229,1070 1229,1054" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <path d="M950 990 L1018 1020" class="callout"/>
  <text x="837" y="997" class="label">Corner cap wall</text>
  <path d="M1435 1032 L1255 1054" class="callout"/>
  <text x="1370" y="1018" class="label">Captured M2 nut</text>
  <text x="929" y="1142" class="label">M2×12 cross-screw</text>
  <text x="1120" y="1142" class="small">through cap wall and rail rib</text>
  <text x="837" y="1158" class="tiny">One hidden lock per corner prevents the cap lifting off when the assembled</text>
  <text x="837" y="1174" class="tiny">board is carried vertically.</text>
</svg>
