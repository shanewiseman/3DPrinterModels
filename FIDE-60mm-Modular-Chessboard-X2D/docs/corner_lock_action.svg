<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc3b3b"/></marker>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.rail{fill:#20262e;stroke:#0f172a;stroke-width:3}
      .cap{fill:#343b45;stroke:#0f172a;stroke-width:3}.nut{fill:#8b97a4;stroke:#334155;stroke-width:3}
      .steel{fill:#7b8794;stroke:#334155;stroke-width:3}.tenon{fill:#4f8fd8;stroke:#174f91;stroke-width:3}
      .mortise{fill:#e8dcc0;stroke:#8b6c38;stroke-width:3;stroke-dasharray:8 5}.miter{stroke:#f0b94d;stroke-width:5}
      .move{fill:none;stroke:#dc3b3b;stroke-width:7;marker-end:url(#arrow)}
      .title{font:700 28px Arial;fill:#172033}.head{font:700 24px Arial;fill:#172033}.label{font:700 19px Arial;fill:#233044}
      .text{font:17px Arial;fill:#526174}.badge{fill:#2563eb}.badgeText{font:700 20px Arial;fill:#fff;text-anchor:middle}
      .ok{fill:#eaf8ef;stroke:#41a467;stroke-width:3}.cut{fill:#eef3f8;stroke:#64748b;stroke-width:3}
    </style>
  </defs>
  <rect width="1500" height="560" rx="20" fill="#eef3f8"/>
  <text x="35" y="44" class="title">45° corner lock — mortise rail first, tenon rail inward, cap and cross-screw last</text>

  <rect x="30" y="70" width="455" height="455" rx="16" class="panel"/>
  <circle cx="67" cy="108" r="22" class="badge"/><text x="67" y="115" class="badgeText">1</text>
  <text x="102" y="116" class="head">Engage the tenon</text>
  <path d="M95 365 V180 H195 V305 H365 V405 H95 Z" class="rail"/>
  <path d="M195 305 L270 380" class="miter"/>
  <path d="M206 312 L232 338 L248 322 L222 296 Z" class="mortise"/>
  <path d="M235 345 L264 374 L281 357 L252 328 Z" class="tenon"/>
  <path d="M390 330 H302" class="move"/>
  <text x="95" y="435" class="label">Push the locking rail straight inward</text>
  <text x="95" y="463" class="text">Its panel tongue and corner tenon seat together.</text>
  <text x="95" y="491" class="text">Yellow line = complementary 45° miter faces.</text>

  <rect x="520" y="70" width="455" height="455" rx="16" class="panel"/>
  <circle cx="557" cy="108" r="22" class="badge"/><text x="557" y="115" class="badgeText">2</text>
  <text x="592" y="116" class="head">Load nut; lower cap</text>
  <path d="M585 380 V230 H720 V310 H895 V410 H585 Z" class="rail"/>
  <path d="M720 310 L790 380" class="miter"/>
  <rect x="645" y="244" width="48" height="95" rx="5" class="cut"/>
  <polygon points="650,172 670,160 690,172 690,196 670,208 650,196" class="nut"/>
  <path d="M670 214 V245" class="move"/>
  <path d="M590 145 H885 V205 H850 V350 H805 V220 H670 V350 H625 V205 H590 Z" class="cap"/>
  <path d="M740 217 V272" class="move"/>
  <text x="585" y="439" class="label">Cap slots capture both mitered cores</text>
  <text x="585" y="467" class="text">Keep the cap level and its recessed hole</text>
  <text x="585" y="491" class="text">facing the named locking rail.</text>

  <rect x="1010" y="70" width="460" height="455" rx="16" class="panel"/>
  <circle cx="1047" cy="108" r="22" class="badge"/><text x="1047" y="115" class="badgeText">3</text>
  <text x="1082" y="116" class="head">Install the cross-screw</text>
  <rect x="1055" y="205" width="365" height="185" rx="12" class="cap"/>
  <path d="M1165 225 H1330 V370 H1165 Z" class="rail"/>
  <path d="M1165 370 L1240 295" class="miter"/>
  <polygon points="1280,272 1300,260 1320,272 1320,296 1300,308 1280,296" class="nut"/>
  <rect x="1088" y="276" width="202" height="18" rx="8" class="steel"/>
  <circle cx="1098" cy="285" r="19" class="steel"/>
  <path d="M1028 285 H1073" class="move"/>
  <rect x="1048" y="412" width="380" height="72" rx="12" class="ok"/>
  <text x="1068" y="441" class="label">Locked state</text>
  <text x="1068" y="467" class="text">Tenon + cap + M2×12 retain the corner.</text>
  <text x="1055" y="182" class="label">Tighten only until the cap is retained</text>
  <text x="1055" y="508" class="text">Do not use the screw to pull an unseated miter closed.</text>
</svg>
